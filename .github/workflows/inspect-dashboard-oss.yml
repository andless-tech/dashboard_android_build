name: Inspect Dashboard OSS Releases

run-name: Inspect dashboard and dashboard-android OSS releases

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Validate OSS credentials
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          clean_access_key_id=$(printf '%s' "$OSS_ACCESS_KEY_ID" | tr -d '[:space:]')
          clean_access_key_secret=$(printf '%s' "$OSS_ACCESS_KEY_SECRET" | tr -d '[:space:]')
          if [[ -z "$clean_access_key_id" || -z "$clean_access_key_secret" ]]; then
            echo "::error::OSS_ACCESS_KEY_ID and OSS_ACCESS_KEY_SECRET must be configured as Actions secrets"
            exit 1
          fi
          echo "::add-mask::$clean_access_key_id"
          echo "::add-mask::$clean_access_key_secret"
          echo "OSS_ACCESS_KEY_ID=$clean_access_key_id" >> "$GITHUB_ENV"
          echo "OSS_ACCESS_KEY_SECRET=$clean_access_key_secret" >> "$GITHUB_ENV"

      - name: Install ossutil
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ossutil-2.3.0-linux-amd64.zip"
          install_dir="$RUNNER_TEMP/ossutil-bin"
          curl --fail --location --retry 3 --output "$archive" \
            https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip
          echo "3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a  $archive" \
            | sha256sum --check
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          chmod 755 "$install_dir/ossutil-2.3.0-linux-amd64/ossutil"
          echo "$install_dir/ossutil-2.3.0-linux-amd64" >> "$GITHUB_PATH"

      - name: List dashboard objects
        env:
          OSS_REGION: cn-shanghai
          OSS_ENDPOINT: https://oss-cn-shanghai.aliyuncs.com
        run: |
          set -euo pipefail
          ossutil ls oss://quic-console-ota/dashboard/ --recursive

      - name: List Android release objects
        env:
          OSS_REGION: cn-shanghai
          OSS_ENDPOINT: https://oss-cn-shanghai.aliyuncs.com
        run: |
          set -euo pipefail
          echo '--- legacy release/ ---'
          ossutil ls oss://quic-console-ota/release/ --recursive
          echo '--- dashboard-android/ ---'
          ossutil ls oss://quic-console-ota/dashboard-android/ --recursive
          echo '--- legacy release/versions/ (expected empty) ---'
          ossutil ls oss://quic-console-ota/release/versions/ --recursive

      - name: Read and validate latest.json
        env:
          OSS_REGION: cn-shanghai
          OSS_ENDPOINT: https://oss-cn-shanghai.aliyuncs.com
        run: |
          set -euo pipefail
          latest_json="$RUNNER_TEMP/dashboard-latest.json"
          ossutil cp oss://quic-console-ota/dashboard/release/latest.json "$latest_json" --force
          echo '--- dashboard/release/latest.json ---'
          jq . "$latest_json"

      - name: Read and validate Android latest.json
        env:
          OSS_REGION: cn-shanghai
          OSS_ENDPOINT: https://oss-cn-shanghai.aliyuncs.com
        run: |
          set -euo pipefail
          latest_json="$RUNNER_TEMP/dashboard-android-latest.json"
          ossutil cp oss://quic-console-ota/dashboard-android/release/latest.json "$latest_json" --force
          echo '--- dashboard-android/release/latest.json ---'
          jq . "$latest_json"
