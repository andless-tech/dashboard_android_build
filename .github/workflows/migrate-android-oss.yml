name: Migrate Android OSS Layout

run-name: Migrate release/versions to dashboard-android/release/versions

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MOVE_RELEASE_VERSIONS to confirm deletion after verification
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Validate confirmation and OSS credentials
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "MOVE_RELEASE_VERSIONS" ]]; then
            echo "::error::confirmation must be MOVE_RELEASE_VERSIONS"
            exit 1
          fi
          clean_access_key_id=$(printf '%s' "$OSS_ACCESS_KEY_ID" | tr -d '[:space:]')
          clean_access_key_secret=$(printf '%s' "$OSS_ACCESS_KEY_SECRET" | tr -d '[:space:]')
          if [[ -z "$clean_access_key_id" || -z "$clean_access_key_secret" ]]; then
            echo "::error::OSS_ACCESS_KEY_ID and OSS_ACCESS_KEY_SECRET must be configured as Actions secrets"
            exit 1
          fi
          echo "::add-mask::$clean_access_key_id"
          echo "::add-mask::$clean_access_key_secret"
          echo "OSS_ACCESS_KEY_ID=$clean_access_key_id" >> "$GITHUB_ENV"
          echo "OSS_ACCESS_KEY_SECRET=$clean_access_key_secret" >> "$GITHUB_ENV"

      - name: Install ossutil
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ossutil-2.3.0-linux-amd64.zip"
          install_dir="$RUNNER_TEMP/ossutil-bin"
          curl --fail --location --retry 3 --output "$archive" \
            https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip
          echo "3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a  $archive" \
            | sha256sum --check
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          chmod 755 "$install_dir/ossutil-2.3.0-linux-amd64/ossutil"
          echo "$install_dir/ossutil-2.3.0-linux-amd64" >> "$GITHUB_PATH"

      - name: Copy, verify, publish manifest, and remove source objects
        env:
          OSS_REGION: cn-shanghai
          OSS_ENDPOINT: https://oss-cn-shanghai.aliyuncs.com
        run: |
          set -euo pipefail
          source_prefix="oss://quic-console-ota/release/versions/"
          destination_prefix="oss://quic-console-ota/dashboard-android/release/versions/"
          latest_manifest_object="oss://quic-console-ota/dashboard-android/release/latest.json"

          source_listing=$(ossutil ls "$source_prefix" --recursive)
          printf '%s\n' "$source_listing"
          mapfile -t source_objects < <(
            printf '%s\n' "$source_listing" \
              | awk '$NF ~ /^oss:\/\// {print $NF}'
          )
          if (( ${#source_objects[@]} == 0 )); then
            echo "::error::No source version objects found"
            exit 1
          fi

          versions=()
          for source_object in "${source_objects[@]}"; do
            if [[ ! "$source_object" =~ ^oss://quic-console-ota/release/versions/(v[0-9]+\.[0-9]+\.[0-9]+)/app-release\.apk$ ]]; then
              echo "::error::Unexpected source object: $source_object"
              exit 1
            fi
            version_tag="${BASH_REMATCH[1]}"
            versions+=("$version_tag")
            destination_object="${source_object/$source_prefix/$destination_prefix}"
            echo "Copying $source_object -> $destination_object"
            ossutil cp "$source_object" "$destination_object" --force

            source_stat="$RUNNER_TEMP/source-${version_tag}.json"
            destination_stat="$RUNNER_TEMP/destination-${version_tag}.json"
            ossutil stat "$source_object" --output-format json > "$source_stat"
            ossutil stat "$destination_object" --output-format json > "$destination_stat"
            for property in Content-Length Content-Md5; do
              source_value=$(jq -r --arg property "$property" '.[$property]' "$source_stat")
              destination_value=$(jq -r --arg property "$property" '.[$property]' "$destination_stat")
              if [[ "$source_value" != "$destination_value" ]]; then
                echo "::error::$property mismatch for $version_tag"
                exit 1
              fi
            done
          done

          latest_tag=$(printf '%s\n' "${versions[@]}" | sort -V | tail -n 1)
          latest_version="${latest_tag#v}"
          latest_key="dashboard-android/release/versions/$latest_tag/app-release.apk"
          latest_object="oss://quic-console-ota/$latest_key"
          latest_stat="$RUNNER_TEMP/source-${latest_tag}.json"
          latest_apk="$RUNNER_TEMP/app-release.apk"
          manifest="$RUNNER_TEMP/latest.json"

          ossutil cp "$latest_object" "$latest_apk" --force
          apk_sha256=$(sha256sum "$latest_apk" | awk '{print $1}')
          apk_size=$(stat -c '%s' "$latest_apk")
          source_commit=$(jq -r '."X-Oss-Meta-Source-Commit" // ""' "$latest_stat")
          last_modified=$(jq -r '."Last-Modified"' "$latest_stat")
          build_time=$(date -u -d "$last_modified" '+%Y-%m-%dT%H:%M:%SZ')

          jq -n \
            --arg version "$latest_version" \
            --arg commit "$source_commit" \
            --arg build_time "$build_time" \
            --arg object_key "$latest_key" \
            --arg sha256 "$apk_sha256" \
            --argjson size "$apk_size" \
            '{
              schema_version: 2,
              app: "dashboard-android",
              channel: "release",
              version: $version,
              commit: $commit,
              build_time: $build_time,
              force: false,
              artifacts: {
                android: {
                  filename: "app-release.apk",
                  object_key: $object_key,
                  sha256: $sha256,
                  size: $size
                }
              }
            }' > "$manifest"

          jq . "$manifest"
          ossutil cp "$manifest" "$latest_manifest_object" --force \
            --content-type application/json \
            --cache-control "no-cache, no-store, must-revalidate"
          downloaded_manifest="$RUNNER_TEMP/downloaded-latest.json"
          ossutil cp "$latest_manifest_object" "$downloaded_manifest" --force
          cmp "$manifest" "$downloaded_manifest"

          destination_listing=$(ossutil ls "$destination_prefix" --recursive)
          mapfile -t destination_objects < <(
            printf '%s\n' "$destination_listing" \
              | awk '$NF ~ /^oss:\/\// {print $NF}'
          )
          if (( ${#destination_objects[@]} != ${#source_objects[@]} )); then
            echo "::error::Destination object count does not match source"
            exit 1
          fi

          echo "All destination objects and latest.json verified; removing legacy version objects"
          for source_object in "${source_objects[@]}"; do
            ossutil rm "$source_object" --force
          done

          remaining_listing=$(ossutil ls "$source_prefix" --recursive)
          if printf '%s\n' "$remaining_listing" | awk '$NF ~ /^oss:\/\// {found=1} END {exit !found}'; then
            echo "::error::Legacy version objects remain after deletion"
            printf '%s\n' "$remaining_listing"
            exit 1
          fi

          echo '--- final dashboard-android layout ---'
          ossutil ls oss://quic-console-ota/dashboard-android/ --recursive
          echo '--- dashboard-android/release/latest.json ---'
          jq . "$downloaded_manifest"
