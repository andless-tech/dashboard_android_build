name: Build Android APK

run-name: Build ${{ inputs.version_tag }} from ${{ inputs.source_ref }} (${{ inputs.build_mode }})

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit from dashboard_android
        required: true
        default: main
        type: string
      version_tag:
        description: Semantic version tag, for example v0.0.27
        required: true
        type: string
      build_mode:
        description: APK build mode
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
      native_ref:
        description: Optional quic_mobile_native_library commit from Gitee
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: android-${{ inputs.version_tag }}-${{ inputs.build_mode }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Validate release inputs
        env:
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}
          BUILD_MODE: ${{ inputs.build_mode }}
          GH_TOKEN: ${{ github.token }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ ! "$INPUT_VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version_tag must match vMAJOR.MINOR.PATCH, for example v0.0.27"
            exit 1
          fi

          echo "RELEASE_TAG=$INPUT_VERSION_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${INPUT_VERSION_TAG#v}" >> "$GITHUB_ENV"

          if [[ "$BUILD_MODE" == "release" ]]; then
            clean_access_key_id=$(printf '%s' "$OSS_ACCESS_KEY_ID" | tr -d '[:space:]')
            clean_access_key_secret=$(printf '%s' "$OSS_ACCESS_KEY_SECRET" | tr -d '[:space:]')
            if [[ -z "$clean_access_key_id" || -z "$clean_access_key_secret" ]]; then
              echo "::error::OSS_ACCESS_KEY_ID and OSS_ACCESS_KEY_SECRET must be configured as Actions secrets"
              exit 1
            fi
            if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || \
                  -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
              echo "::error::Android release signing secrets are not fully configured"
              exit 1
            fi
            echo "::add-mask::$clean_access_key_id"
            echo "::add-mask::$clean_access_key_secret"
            echo "OSS_ACCESS_KEY_ID=$clean_access_key_id" >> "$GITHUB_ENV"
            echo "OSS_ACCESS_KEY_SECRET=$clean_access_key_secret" >> "$GITHUB_ENV"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$INPUT_VERSION_TAG" >/dev/null 2>&1; then
              echo "::error::Tag $INPUT_VERSION_TAG already exists in $GITHUB_REPOSITORY"
              exit 1
            fi
          fi

      - name: Install ossutil
        if: inputs.build_mode == 'release'
        run: |
          archive="$RUNNER_TEMP/ossutil-2.3.0-linux-amd64.zip"
          install_dir="$RUNNER_TEMP/ossutil-bin"
          curl --fail --location --retry 3 --output "$archive" \
            https://gosspublic.alicdn.com/ossutil/v2/2.3.0/ossutil-2.3.0-linux-amd64.zip
          echo "3ae4d9fc85a7a6e9f5654d1599766f1a3a42a3692870887b5ae9338d582ef65a  $archive" \
            | sha256sum --check
          mkdir -p "$install_dir"
          unzip -q "$archive" -d "$install_dir"
          chmod 755 "$install_dir/ossutil-2.3.0-linux-amd64/ossutil"
          echo "$install_dir/ossutil-2.3.0-linux-amd64" >> "$GITHUB_PATH"

      - name: Validate OSS credentials
        if: inputs.build_mode == 'release'
        env:
          OSS_REGION: cn-shanghai
          OSS_ENDPOINT: https://oss-cn-shanghai.aliyuncs.com
        run: ossutil stat oss://quic-console-ota >/dev/null

      - name: Check out private source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: andless-tech/dashboard_android
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.DASHBOARD_ANDROID_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Record source revision
        working-directory: source
        run: echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Prepare Android release signing
        if: inputs.build_mode == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/andless-dashboard-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -list -keystore "$keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.38.1"
          channel: stable
          cache: true

      - name: Install Android SDK packages
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"
          "cmake;3.22.1"
          "ndk;28.2.13676358"

      - name: Build native QUIC client
        if: inputs.native_ref != ''
        env:
          NATIVE_REF: ${{ inputs.native_ref }}
        run: |
          set -euo pipefail
          git clone --depth 1 https://gitee.com/endless-tech/quic_mobile_native_library.git native
          git -C native checkout --detach "$NATIVE_REF"
          cmake -S native -B native/build/ci \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24
          cmake --build native/build/ci --parallel 2
          install -m 0755 native/build/ci/libquic_client.so \
            source/android/src/main/jniLibs/arm64-v8a/libquic_client.so
          install -m 0755 native/build/ci/libquic_client.so \
            source/quic/libquic_client.so
          sha256sum source/android/src/main/jniLibs/arm64-v8a/libquic_client.so

      - name: Resolve dependencies
        working-directory: source/example
        run: flutter pub get --enforce-lockfile

      - name: Build APK
        working-directory: source/example
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/andless-dashboard-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          flutter build apk --"$BUILD_MODE" --no-pub
          --build-name "$RELEASE_VERSION"
          --build-number "$GITHUB_RUN_NUMBER"

      - name: Rename APK
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
        run: >-
          mv "source/example/build/app/outputs/flutter-apk/app-$BUILD_MODE.apk"
          "source/example/build/app/outputs/flutter-apk/andless_dashboard.apk"

      - name: Verify embedded APK version
        run: |
          apk="source/example/build/app/outputs/flutter-apk/andless_dashboard.apk"
          package_info=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | head -n 1)
          echo "$package_info"
          if [[ "$package_info" != *"versionCode='$GITHUB_RUN_NUMBER'"* ]]; then
            echo "::error::APK versionCode does not match Actions run number $GITHUB_RUN_NUMBER"
            exit 1
          fi
          if [[ "$package_info" != *"versionName='$RELEASE_VERSION'"* ]]; then
            echo "::error::APK versionName does not match release version $RELEASE_VERSION"
            exit 1
          fi

      - name: Verify release signing certificate
        if: inputs.build_mode == 'release'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk="source/example/build/app/outputs/flutter-apk/andless_dashboard.apk"
          keystore="$RUNNER_TEMP/andless-dashboard-release.jks"
          expected_digest=$(keytool -exportcert -keystore "$keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | sha256sum | awk '{print $1}')
          actual_digest=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify --print-certs "$apk" | \
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          if [[ -z "$actual_digest" || "$actual_digest" != "$expected_digest" ]]; then
            echo "::error::APK signing certificate does not match the configured release keystore"
            exit 1
          fi
          echo "Verified release signing certificate SHA-256: $actual_digest"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-android-${{ env.RELEASE_TAG }}-${{ inputs.build_mode }}
          path: source/example/build/app/outputs/flutter-apk/andless_dashboard.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish release APK to OSS
        if: inputs.build_mode == 'release'
        env:
          OSS_REGION: cn-shanghai
          OSS_ENDPOINT: https://oss-cn-shanghai.aliyuncs.com
        run: |
          set -euo pipefail
          apk="source/example/build/app/outputs/flutter-apk/andless_dashboard.apk"
          versioned_key="dashboard-android/release/versions/$RELEASE_TAG/andless_dashboard.apk"
          versioned_object="oss://quic-console-ota/$versioned_key"
          versioned_manifest="oss://quic-console-ota/dashboard-android/release/versions/$RELEASE_TAG/manifest.json"
          latest_manifest="oss://quic-console-ota/dashboard-android/release/latest.json"
          manifest="$RUNNER_TEMP/dashboard-android-manifest.json"

          test -f "$apk"
          apk_sha256=$(sha256sum "$apk" | awk '{print $1}')
          apk_size=$(stat -c '%s' "$apk")
          build_time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          echo "$apk_sha256  $apk"

          ossutil cp "$apk" "$versioned_object" --force \
            --content-type application/vnd.android.package-archive \
            --cache-control "public, max-age=31536000, immutable" \
            --metadata "version=$RELEASE_VERSION" \
            --metadata "build-code=$GITHUB_RUN_NUMBER" \
            --metadata "source-commit=$SOURCE_COMMIT"

          jq -n \
            --arg version "$RELEASE_VERSION" \
            --arg commit "$SOURCE_COMMIT" \
            --arg build_time "$build_time" \
            --arg filename "andless_dashboard.apk" \
            --arg object_key "$versioned_key" \
            --arg sha256 "$apk_sha256" \
            --argjson size "$apk_size" \
            '{
              schema_version: 2,
              app: "dashboard-android",
              channel: "release",
              version: $version,
              commit: $commit,
              build_time: $build_time,
              force: false,
              artifacts: {
                android: {
                  filename: $filename,
                  object_key: $object_key,
                  sha256: $sha256,
                  size: $size
                }
              }
            }' > "$manifest"

          jq . "$manifest"
          ossutil cp "$manifest" "$versioned_manifest" --force \
            --content-type application/json \
            --cache-control "public, max-age=31536000, immutable"
          ossutil cp "$manifest" "$latest_manifest" --force \
            --content-type application/json \
            --cache-control "no-cache, no-store, must-revalidate"
          ossutil stat "$versioned_object"
          ossutil stat "$versioned_manifest"
          ossutil stat "$latest_manifest"

      - name: Tag published release
        if: inputs.build_mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_object_sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$RELEASE_TAG" \
            -f message="Android $RELEASE_VERSION from andless-tech/dashboard_android@$SOURCE_COMMIT" \
            -f object="$GITHUB_SHA" \
            -f type=commit \
            --jq .sha)
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" \
            -f sha="$tag_object_sha"
