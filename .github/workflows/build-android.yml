name: Build Android APK (signed artifact only)

run-name: Build ${{ inputs.version_tag }} from ${{ inputs.source_ref }} (${{ inputs.build_mode }})

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit from dashboard_android
        required: true
        default: main
        type: string
      version_tag:
        description: Semantic version tag, for example v0.0.27
        required: true
        type: string
      build_mode:
        description: APK build mode
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
      force_update:
        description: Require users on older versions to update
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-${{ inputs.version_tag }}-${{ inputs.build_mode }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Validate release inputs
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_ref }}
          INPUT_VERSION_TAG: ${{ inputs.version_tag }}
          BUILD_MODE: ${{ inputs.build_mode }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DJI_APP_KEY: ${{ secrets.DJI_APP_KEY }}
        run: |
          if [[ ! "$INPUT_VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version_tag must match vMAJOR.MINOR.PATCH, for example v0.0.27"
            exit 1
          fi

          echo "RELEASE_TAG=$INPUT_VERSION_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${INPUT_VERSION_TAG#v}" >> "$GITHUB_ENV"

          if [[ "$BUILD_MODE" == "release" ]]; then
            if [[ -z "$DJI_APP_KEY" ]]; then
              echo "::error::DJI_APP_KEY must be configured for MSDK-enabled Release builds"
              exit 1
            fi
            if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || \
                  -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
              echo "::error::Android release signing secrets are not fully configured"
              exit 1
            fi
            if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Use a full, immutable Android source commit SHA"
              exit 1
            fi
          fi

      - name: Check out artifact recipient certificate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: packaging

      - name: Check out private source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: andless-tech/dashboard_android
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.DASHBOARD_ANDROID_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Record source revision
        working-directory: source
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          test "$actual" = "$EXPECTED_SOURCE_SHA"
          echo "SOURCE_COMMIT=$actual" >> "$GITHUB_ENV"
          echo "Frozen Android source: $actual"

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Prepare Android release signing
        if: inputs.build_mode == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/andless-dashboard-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          keytool -list -keystore "$keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.38.1"
          channel: stable
          cache: true

      - name: Install Android SDK packages
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"
          "cmake;3.22.1"
          "ndk;28.2.13676358"

      - name: Resolve dependencies
        working-directory: source/example
        run: flutter pub get --enforce-lockfile

      - name: Test video configuration routing
        working-directory: source/example
        run: flutter test --no-pub ../test/device_video_config_test.dart

      - name: Test input sources and channel settings
        working-directory: source/example
        run: |
          flutter test --no-pub \
            ../test/dji_input_test.dart ../test/dji_input_settings_test.dart \
            ../test/dji_input_detected_dialog_test.dart ../test/gamepad_input_test.dart \
            ../test/gamepad_sources_test.dart ../test/channel_input_sources_test.dart \
            ../test/channel_settings_test.dart ../test/channel_output_meter_test.dart \
            ../test/joystick_input_test.dart ../test/phone_tilt_input_test.dart \
            ../test/pwm_wire_test.dart ../test/device_removal_test.dart ../test/qr_no_camera_test.dart

      - name: Check optional SDK device gate and video lifecycle
        working-directory: source
        run: |
          python3 tool/check_dji_device_support.py
          python3 tool/check_video_lifecycle.py

      - name: Test optional firmware release notices
        working-directory: source/example
        run: |
          if [ -f ../test/firmware_release_test.dart ]; then
            flutter test --no-pub ../test/firmware_release_test.dart
          fi
          if [ -f ../test/update_dialog_test.dart ]; then
            flutter test --no-pub ../test/update_test.dart ../test/update_dialog_test.dart ../test/control_plane_test.dart
          fi

      - name: Build APK
        working-directory: source/example
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/andless-dashboard-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          DJI_APP_KEY: ${{ secrets.DJI_APP_KEY }}
        run: >-
          flutter build apk --"$BUILD_MODE" --no-pub
          --target-platform android-arm64
          --build-name "$RELEASE_VERSION"
          --build-number "$GITHUB_RUN_NUMBER"

      - name: Rename APK
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
        run: >-
          mv "source/example/build/app/outputs/flutter-apk/app-$BUILD_MODE.apk"
          "source/example/build/app/outputs/flutter-apk/andless_dashboard.apk"

      - name: Verify diagnostic export key material
        run: >-
          python3 source/tool/verify_diagnostic_apk.py
          source/example/build/app/outputs/flutter-apk/andless_dashboard.apk

      - name: Verify DJI native runtime
        run: >-
          python3 source/tool/verify_dji_apk.py
          source/example/build/app/outputs/flutter-apk/andless_dashboard.apk

      - name: Verify embedded APK version
        run: |
          apk="source/example/build/app/outputs/flutter-apk/andless_dashboard.apk"
          package_info=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | head -n 1)
          echo "$package_info"
          if [[ "$package_info" != *"versionCode='$GITHUB_RUN_NUMBER'"* ]]; then
            echo "::error::APK versionCode does not match Actions run number $GITHUB_RUN_NUMBER"
            exit 1
          fi
          if [[ "$package_info" != *"versionName='$RELEASE_VERSION'"* ]]; then
            echo "::error::APK versionName does not match release version $RELEASE_VERSION"
            exit 1
          fi

      - name: Verify release signing certificate
        if: inputs.build_mode == 'release'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk="source/example/build/app/outputs/flutter-apk/andless_dashboard.apk"
          keystore="$RUNNER_TEMP/andless-dashboard-release.jks"
          expected_digest=$(keytool -exportcert -keystore "$keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" | sha256sum | awk '{print $1}')
          actual_digest=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            verify --print-certs "$apk" | \
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          if [[ -z "$actual_digest" || "$actual_digest" != "$expected_digest" ]]; then
            echo "::error::APK signing certificate does not match the configured release keystore"
            exit 1
          fi
          echo "Verified release signing certificate SHA-256: $actual_digest"

      - name: Record APK SHA-256 and native library identity
        working-directory: source
        run: |
          set -euo pipefail
          apk=example/build/app/outputs/flutter-apk/andless_dashboard.apk
          sha256sum "$apk"
          packaged=$(unzip -p "$apk" lib/arm64-v8a/libquic_client.so | sha256sum | cut -d' ' -f1)
          source=$(sha256sum quic/libquic_client.so | cut -d' ' -f1)
          test "$packaged" = "$source"
          echo "APK native library SHA-256: $packaged"

      - name: Encrypt signed APK for local delivery
        run: |
          set -euo pipefail
          openssl cms -encrypt -binary -aes-256-gcm -outform DER \
            -recip packaging/.github/android-v0.0.62-artifact-recipient.pem -keyopt rsa_padding_mode:oaep \
            -in source/example/build/app/outputs/flutter-apk/andless_dashboard.apk \
            -out "$RUNNER_TEMP/andless-dashboard.apk.cms"

      - name: Upload encrypted APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-android-${{ env.RELEASE_TAG }}-${{ inputs.build_mode }}
          path: ${{ runner.temp }}/andless-dashboard.apk.cms
          if-no-files-found: error
          retention-days: 14
