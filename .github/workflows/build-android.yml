name: Build Android APK

run-name: Build ${{ inputs.source_ref }} (${{ inputs.build_mode }})

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit from dashboard_android
        required: true
        default: main
        type: string
      build_mode:
        description: APK build mode
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

concurrency:
  group: android-${{ inputs.source_ref }}-${{ inputs.build_mode }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out private source repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: andless-tech/dashboard_android
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.DASHBOARD_ANDROID_DEPLOY_KEY }}
          persist-credentials: false
          fetch-depth: 1
          path: source

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.38.1"
          channel: stable
          cache: true

      - name: Install Android SDK packages
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"
          "cmake;3.22.1"

      - name: Resolve dependencies
        working-directory: source/example
        run: flutter pub get

      - name: Build APK
        working-directory: source/example
        run: flutter build apk --${{ inputs.build_mode }}

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-android-${{ inputs.build_mode }}-${{ github.run_number }}
          path: source/example/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
